<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Concessionária</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1><i class="ri-car-line"></i> Sistema Concessionária</h1>
    <nav>
      <a href="#dashboard">Dashboard</a>
      <a href="#veiculos">Veículos</a>
      <a href="#vendas">Vendas</a>
    </nav>
  </header>
  <main id="dashboard">
    <h2>Dashboard</h2>
    <div class="cards">
      <div class="card">
        <i class="ri-car-line card-icon"></i>
        <div class="card-info">
          <p class="card-label">Veículos em Estoque</p>
          <p class="card-valor">24</p>
        </div>
      </div>
      <div class="card">
        <i class="ri-money-dollar-circle-line card-icon"></i>
        <div class="card-info">
          <p class="card-label">Vendas no Mês</p>
          <p class="card-valor">8</p>
        </div>
      </div>
      <div class="card">
        <i class="ri-line-chart-line card-icon"></i>
        <div class="card-info">
          <p class="card-label">Receita do Mês</p>
          <p class="card-valor">R$ 420.000</p>
        </div>
      </div>
      <div class="card">
        <i class="ri-group-line card-icon"></i>
        <div class="card-info">
          <p class="card-label">Clientes Ativos</p>
          <p class="card-valor">37</p>
        </div>
      </div>
    </div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
