<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso — GPS.dev</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Partícula de fundo sutil */
    .bg-glow {
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(249,115,22,0.07) 0%, transparent 70%);
      top: -200px; left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="login-page">
    <div class="login-box">

      <div class="login-logo">
        <div class="logo-mark">
          <i class="ri-code-s-slash-line"></i>
        </div>
        <h1>NOME DO SISTEMA</h1>
        <p>Acesso restrito — GPS.dev</p>
      </div>

      <div class="login-card">
        <div id="erro" class="alert alert-danger" style="display:none;">
          <i class="ri-error-warning-line"></i>
          <span>Senha incorreta. Tente novamente.</span>
        </div>

        <div class="form-group">
          <label for="senha">Senha de acesso</label>
          <input
            type="password"
            id="senha"
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </div>

        <button class="btn btn-primary" onclick="entrar()">
          <i class="ri-login-box-line"></i>
          Entrar
        </button>
      </div>

      <div class="login-footer">
        Sistema desenvolvido por <strong>GPS.dev</strong>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Redireciona se já estiver logado
    if (sessionStorage.getItem(GPS.config.loginKey)) {
      window.location.href = 'dashboard.html';
    }

    function entrar() {
      const senha = document.getElementById('senha').value;
      const erro  = document.getElementById('erro');
      if (GPS.auth.login(senha)) {
        window.location.href = 'dashboard.html';
      } else {
        erro.style.display = 'flex';
        document.getElementById('senha').value = '';
        document.getElementById('senha').focus();
      }
    }

    // Enter para logar
    document.getElementById('senha').addEventListener('keydown', e => {
      if (e.key === 'Enter') entrar();
    });
  </script>
</body>
</html>
